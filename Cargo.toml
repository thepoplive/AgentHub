[package]
name = "agenthub"
version = "0.1.0"
edition = "2021"
description = "A universal manager for discovering and launching local AI coding agents"
license = "MIT"
repository = "https://github.com/thepoplive/AgentHub"

[[bin]]
name = "agenthub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

